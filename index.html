<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive card details form</title>
  <link rel="stylesheet" href="./style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <!-- <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style> -->
</head>
<body>

  <body>

  <main class="container">

    <!-- LEFT SIDE -->
    <section class="card-section">

      <!-- FRONT OF CARD -->
      <div class="card card-front">

        <img src="./images/card-logo.svg" alt="card logo" class="card-logo">

        <p class="card-number" id="card-number-display">
          0000 0000 0000 0000
        </p>

        <div class="card-bottom">
          <p class="card-name" id="card-name-display">
            Daniel Olusegun
          </p>

          <p class="card-expiry">
            <span id="card-month-display">00</span>/<span id="card-year-display">00</span>
          </p>
        </div>

      </div>


      <!-- BACK OF CARD -->
      <div class="card card-back">

        <p class="card-cvc" id="cvc-display">
          000
        </p>

      </div>

    </section>


    <!-- RIGHT SIDE -->
    <section class="form-section">

      <form id="card-form">

        <!-- CARDHOLDER NAME -->
        <div class="form-group">

          <label for="cardholder-name">
            Cardholder Name
          </label>

          <input
            type="text"
            id="cardholder-name"
            placeholder="e.g. Jane Appleseed"
          >

          <p class="error" id="name-error"></p>

        </div>


        <!-- CARD NUMBER -->
        <div class="form-group">

          <label for="card-number">
            Card Number
          </label>

          <input
            type="text"
            id="card-number"
            placeholder="e.g. 1234 5678 9123 0000"
            maxlength="19"
          >

          <p class="error" id="number-error"></p>

        </div>


        <!-- EXPIRY DATE + CVC -->
        <div class="form-row">

          <!-- EXPIRY DATE -->
          <div class="form-group expiry-group">

            <label>
              Exp. Date (MM/YY)
            </label>

            <div class="expiry-inputs">

              <input
                type="text"
                id="expiry-month"
                placeholder="MM"
                maxlength="2"
              >

              <input
                type="text"
                id="expiry-year"
                placeholder="YY"
                maxlength="2"
              >

            </div>

            <p class="error" id="expiry-error"></p>

          </div>


          <!-- CVC -->
          <div class="form-group cvc-group">

            <label for="cvc">
              CVC
            </label>

            <input
              type="text"
              id="cvc"
              placeholder="e.g. 123"
              maxlength="3"
            >

            <p class="error" id="cvc-error"></p>

          </div>

        </div>


        <!-- CONFIRM BUTTON -->
        <button type="submit">
          Confirm
        </button>

      </form>


      <!-- COMPLETED STATE -->
      <div class="completed-state" id="completed-state">

        <h1>Thank you!</h1>

        <p>We've added your card details</p>

        <button type="button" id="continue-button">
          Continue
        </button>

      </div>

    </section>

  </main>


  <footer class="attribution">

    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor
    </a>.

    Coded by
    <a href="#">
      Asore Michael
    </a>.

  </footer>



  <script src="./script.js"></script>
</body>

</html>
